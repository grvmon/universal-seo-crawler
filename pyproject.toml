[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-seo-crawler"
version = "1.0.0"
authors = [
  { name="grvmon" },
]
description = "Free, open-source technical SEO crawler built for 100k+ URLs. Crawls all assets on a flat ~120 MB RAM footprint and exports to a single CSV."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx[http2]>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.0.0",
]

[project.scripts]
universal-crawler = "crawler:main"

[project.urls]
"Homepage" = "https://github.com/grvmon/universal-seo-crawler"
"Bug Tracker" = "https://github.com/grvmon/universal-seo-crawler/issues"

[tool.setuptools]
py-modules = ["crawler"]
